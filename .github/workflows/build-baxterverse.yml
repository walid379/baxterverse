name: Build BaxterVerse

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: WebUI - setup
        uses: ./.github/actions/setup-web
        with:
          working-directory: komga-webui

      - name: WebUI - build
        working-directory: komga-webui
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: NextUI - setup
        uses: ./.github/actions/setup-web
        with:
          working-directory: next-ui

      - name: NextUI - build
        working-directory: next-ui
        run: npm run build:with-i18n

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build JAR
        run: ./gradlew :komga:webuiCopyIndex :komga:nextuiCopyIndex :komga:bootJar

      - name: Prepare BaxterVerse JAR
        shell: bash
        run: |
          mkdir -p artifact

          JAR="$(find komga/build/libs -maxdepth 1 \
            -type f \
            -name 'komga-*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            ! -name '*-plain.jar' \
            | head -n 1)"

          test -n "$JAR"

          cp "$JAR" artifact/BaxterVerse.jar

          ls -lh artifact/BaxterVerse.jar

      - name: Upload BaxterVerse JAR
        uses: actions/upload-artifact@v4
        with:
          name: BaxterVerse-JAR
          path: artifact/BaxterVerse.jar
          retention-days: 14
